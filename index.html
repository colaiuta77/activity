<!-- 사용자별 독서 활동을 필터링하고 탐색하는 풀페이지 화면입니다. -->
<main class="activity-page" id="activity-page">
  <header class="activity-hero">
    <div>
      <p class="activity-eyebrow">BOOKOASIS ACTIVITY</p>
      <h1><i class="fa-solid fa-users-viewfinder" aria-hidden="true"></i> 사용자 활동</h1>
      <p>사용자별 최근 열람 도서와 진행률을 한눈에 확인합니다.</p>
    </div>
    <button class="activity-refresh" id="activity-refresh" type="button">
      <i class="fa-solid fa-rotate" aria-hidden="true"></i>
      새로고침
    </button>
  </header>

  <section class="activity-summary-grid" aria-label="활동 요약">
    <article class="activity-summary-card">
      <span>활동 사용자</span>
      <strong id="activity-summary-users">-</strong>
    </article>
    <article class="activity-summary-card">
      <span>전체 열람 기록</span>
      <strong id="activity-summary-total">-</strong>
    </article>
    <article class="activity-summary-card">
      <span>진행 중</span>
      <strong id="activity-summary-progress">-</strong>
    </article>
    <article class="activity-summary-card activity-summary-complete">
      <span>완독</span>
      <strong id="activity-summary-completed">-</strong>
    </article>
  </section>

  <section class="activity-toolbar" aria-label="활동 필터">
    <label>
      <span>사용자</span>
      <select id="activity-user-filter">
        <option value="all">전체 사용자</option>
      </select>
    </label>
    <label>
      <span>기간</span>
      <select id="activity-period-filter">
        <option value="all">전체 기간</option>
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
      </select>
    </label>
    <label>
      <span>정렬</span>
      <select id="activity-sort-filter">
        <option value="recent">최근 열람순</option>
        <option value="progress">진행률 높은 순</option>
        <option value="username">사용자명순</option>
      </select>
    </label>
  </section>

  <div class="activity-state" id="activity-state" role="status">
    <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
    활동 데이터를 불러오는 중입니다.
  </div>
  <section class="activity-users" id="activity-users" aria-live="polite"></section>
</main>
