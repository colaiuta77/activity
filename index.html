<!-- 사용자별 독서 활동을 필터링하고 탐색하는 풀페이지 화면입니다. -->
<main class="activity-page" id="activity-page">
  <header class="activity-hero">
    <div class="activity-brand">
      <div class="activity-brand-icon"><i class="fa-solid fa-users-viewfinder" aria-hidden="true"></i></div>
      <div class="activity-brand-copy">
        <p class="activity-eyebrow">BOOKOASIS ACTIVITY</p>
        <h1>사용자 활동</h1>
        <p>사용자별 도서 열람·오디오북 청취·비디오북 시청 활동과 진행률을 한눈에 확인합니다.</p>
      </div>
    </div>
    <div class="activity-hero-actions">
      <nav class="activity-library-switch" aria-label="서재 선택">
        <button class="activity-library-btn active" type="button" data-type="general" aria-pressed="true">
          <i class="fa-solid fa-book" aria-hidden="true"></i>
          일반 서재
        </button>
        <button class="activity-library-btn" type="button" data-type="adult" aria-pressed="false">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          성인 서재
        </button>
        <button class="activity-library-btn" type="button" data-type="audiobook" aria-pressed="false">
          <i class="fa-solid fa-headphones" aria-hidden="true"></i>
          오디오북
        </button>
        <button class="activity-library-btn" type="button" data-type="video" aria-pressed="false">
          <i class="fa-solid fa-video" aria-hidden="true"></i>
          비디오북
        </button>
      </nav>
      <button class="activity-refresh" id="activity-refresh" type="button" aria-label="새로고침" title="새로고침">
        <i class="fa-solid fa-rotate" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <section class="activity-summary-grid" aria-label="활동 요약">
    <article class="activity-summary-card">
      <div class="activity-summary-icon"><i class="fa-solid fa-user-group" aria-hidden="true"></i></div>
      <div class="activity-summary-info">
        <span>활동 사용자</span>
        <strong id="activity-summary-users">-</strong>
      </div>
    </article>
    <article class="activity-summary-card">
      <div class="activity-summary-icon"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i></div>
      <div class="activity-summary-info">
        <span id="activity-summary-total-label">전체 열람 기록</span>
        <strong id="activity-summary-total">-</strong>
      </div>
    </article>
    <article class="activity-summary-card">
      <div class="activity-summary-icon"><i class="fa-solid fa-book-open-reader" aria-hidden="true"></i></div>
      <div class="activity-summary-info">
        <span id="activity-summary-progress-label">진행 중</span>
        <strong id="activity-summary-progress">-</strong>
      </div>
    </article>
    <article class="activity-summary-card activity-summary-complete">
      <div class="activity-summary-icon"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></div>
      <div class="activity-summary-info">
        <span id="activity-summary-completed-label">완독</span>
        <strong id="activity-summary-completed">-</strong>
      </div>
    </article>
  </section>

  <section class="activity-toolbar" aria-label="활동 필터">
    <label>
      <span>사용자</span>
      <select id="activity-user-filter">
        <option value="all">전체 사용자</option>
      </select>
    </label>
    <label>
      <span>기간</span>
      <select id="activity-period-filter">
        <option value="all">전체 기간</option>
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
      </select>
    </label>
    <label>
      <span>정렬</span>
      <select id="activity-sort-filter">
        <option value="recent">최근 열람순</option>
        <option value="progress">진행률 높은 순</option>
        <option value="username">사용자명순</option>
      </select>
    </label>
  </section>

  <div class="activity-state" id="activity-state" role="status">
    <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
    활동 데이터를 불러오는 중입니다.
  </div>
  <section class="activity-users" id="activity-users" aria-live="polite"></section>
</main>
